# 生产环境配置
# 关闭 SQL 日志，默认使用生产库；如云端已配置环境变量，会优先读取环境变量

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  schema-patch:
    enabled: ${APP_SCHEMA_PATCH_ENABLED:false}
  bootstrap-users:
    enabled: ${APP_BOOTSTRAP_USERS_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://dev-4g1sv3870175b971-1411764939.tcloudbaseapp.com,https://api.bankaiscl.top,https://bank-admin-backend-239413-10-1411764939.sh.run.tcloudbase.com}
    allowed-origin-patterns: []

logging:
  level:
    com.bank.admin: info
    root: warn

# CloudBase AI 配置（生产环境）
cloudbase:
  ai:
    enabled: true
    secret-id: ${TENCENT_SECRET_ID:your-secret-id}
    secret-key: ${TENCENT_SECRET_KEY:your-secret-key}
    model: hunyuan-pro
    max-tokens: 2000
